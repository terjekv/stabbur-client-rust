name: Release verified client
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  packages: read
concurrency:
  group: versioned-client-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require immutable compatibility metadata
        id: release
        run: python3 scripts/release.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: steps.release.outputs.ready == 'true'
        with:
          toolchain: stable
      - name: Authenticate to GHCR
        if: steps.release.outputs.ready == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify this client source against the released server image
        if: steps.release.outputs.ready == 'true'
        run: scripts/run-integration-tests.sh
        env:
          STABBUR_INTEGRATION_SERVER_IMAGE: ${{ steps.release.outputs.image }}
      - name: Verify the publishable crate package
        if: steps.release.outputs.ready == 'true'
        run: cargo package -p stabbur_client --locked
      - name: Publish the immutable client source and crate package
        if: steps.release.outputs.ready == 'true'
        run: python3 scripts/release.py publish --assets target/package
        env:
          GH_TOKEN: ${{ github.token }}
