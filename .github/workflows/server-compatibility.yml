name: Pinned server compatibility

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Immutable stabbur-server image including @sha256 digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  integration:
    name: Client and independent consumer
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run pinned integration suite
        run: scripts/run-integration-tests.sh
        env:
          STABBUR_INTEGRATION_SERVER_IMAGE: ${{ inputs.server_image }}
